<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>XICK | Cloud Datacenter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

<div class="app-container">
    <aside class="app-sidebar">
        <div class="brand-logo"><i class="fas fa-bolt"></i></div>
        <nav class="side-nav">
            <a href="#" class="side-icon active"><i class="fas fa-th-large"></i></a>
            <a href="#" class="side-icon"><i class="fas fa-server"></i></a>
            <a href="#" class="side-icon"><i class="fas fa-cog"></i></a>
        </nav>
    </aside>

    <main class="app-main">
        <header class="top-bar">
            <div class="brand-text">XICK<span>CLOUD</span></div>
            <div class="header-actions d-flex align-items-center gap-3">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" onkeyup="filterVMs()" placeholder="Rechercher...">
                </div>
                <button class="btn-xick" data-bs-toggle="modal" data-bs-target="#deployModal">
                    <i class="fas fa-rocket me-2"></i> Déployer
                </button>
            </div>
        </header>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <span class="label">CHARGE CPU CLUSTER</span>
                    <h2 id="global-cpu">0%</h2>
                    <div class="progress-xick"><div id="bar-cpu" class="bar primary" style="width: 0%"></div></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <span class="label">RAM UTILISÉE</span>
                    <h2 id="global-ram">0 GiB</h2>
                    <div id="loader" class="spinner-border spinner-border-sm text-primary float-end" style="visibility:hidden"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <span class="label text-success">VMs EN LIGNE</span>
                    <h2 id="global-running" class="text-success">0</h2>
                </div>
            </div>
        </div>

        <section class="vm-section">
            <table class="xick-table">
                <thead>
                    <tr>
                        <th>INSTANCE</th>
                        <th>UTILISATEUR</th>
                        <th>ADRESSE IP</th>
                        <th>RESSOURCES</th>
                        <th>STATUT</th>
                        <th class="text-end">ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="vm-table-body"></tbody>
            </table>
        </section>
    </main>
</div>

<div class="modal fade" id="deployModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form id="deployForm" onsubmit="handleDeploy(event)">
                <div class="modal-body p-4">
                    <h5 class="mb-4 text-white"><i class="fas fa-plus-circle me-2"></i>Nouveau Serveur Cloud</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="small text-muted">Hostname</label>
                            <input type="text" name="hostname" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-muted">Image OS</label>
                            <select name="os_type" class="form-select">
                                <option value="ubuntu">Ubuntu 22.04 LTS</option>
                                <option value="debian">Debian 12</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-muted">Utilisateur</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-muted">Mot de passe</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="small text-muted">vCPUs</label>
                            <input type="number" name="vcpu" value="1" min="1" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="small text-muted">RAM (MiB)</label>
                            <input type="number" name="ram" value="1024" min="512" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="small text-muted">Disque (GB)</label>
                            <input type="number" name="disk" value="10" min="5" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="small text-muted">Clé SSH</label>
                            <select name="ssh_method" class="form-select" onchange="document.getElementById('ssh-area').style.display = (this.value === 'paste') ? 'block' : 'none';">
                                <option value="none">Aucune (Mot de passe)</option>
                                <option value="paste">Coller une clé publique</option>
                            </select>
                        </div>
                        <div class="col-12" id="ssh-area" style="display:none;">
                            <textarea name="ssh_key_paste" class="form-control mt-2" rows="3"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-dark" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" id="deployBtn" class="btn-xick">Démarrer le déploiement</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../static/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/dashbord.js"></script>
</body>
</html>
