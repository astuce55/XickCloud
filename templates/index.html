<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>NEXUS | Hypervisor Control</title>
    
    <!-- CSS LOCAL (Offline) -->
    <link href="{{ url_for('static', filename='css/all.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
    
    <!-- POLICE -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap');

        :root {
            /* PALETTE PROXMOX / MIDNIGHT */
            --bg-body: #0f172a;       /* Fond Bleu Nuit profond */
            --bg-card: #1e293b;       /* Fond Cartes */
            --bg-dock: #020617;       /* Fond Dock Actions */
            --border-color: #334155;  /* Bordures subtiles */
            
            --primary: #3b82f6;       /* Bleu Tech */
            --accent: #f97316;        /* Orange Proxmox */
            --success: #10b981;       /* Vert Matrix */
            --danger: #ef4444;        /* Rouge Alerte */
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- NAVBAR TECH --- */
        .navbar-prox {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        
        .brand-box {
            display: flex; align-items: center; gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -1px;
        }
        .brand-icon {
            background: var(--accent); color: white;
            width: 32px; height: 32px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem;
        }
        .brand-text span { color: var(--accent); }

        .btn-create {
            background: var(--primary); border: none;
            color: white; font-weight: 500;
            padding: 8px 20px; border-radius: 4px;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        .btn-create:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        /* --- STATS HEADER (DASHBOARD STYLE) --- */
        .stat-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-icon-box {
            width: 45px; height: 45px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; background: rgba(255,255,255,0.05);
        }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
        .stat-val { font-size: 1.5rem; font-weight: 700; color: white; font-family: 'JetBrains Mono', monospace; }

        /* --- VM CARDS (SERVER RACK STYLE) --- */
        .vm-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .vm-col { width: 100%; max-width: 360px; }

        .vm-rack {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--border-color); /* Status bar line */
            border-radius: 6px;
            padding: 20px;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }
        .vm-rack:hover { transform: translateY(-3px); border-top-color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        .vm-rack.running { border-top-color: var(--success); }
        .vm-rack.stopped { border-top-color: var(--border-color); }

        .rack-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .vm-name { font-size: 1.1rem; font-weight: 700; color: white; margin: 0; }
        .vm-ip { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 3px; }

        .status-pill {
            font-size: 0.65rem; text-transform: uppercase; font-weight: 800;
            padding: 2px 8px; border-radius: 2px; letter-spacing: 0.5px;
        }
        .status-pill.run { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-pill.stop { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.2); }

        /* Metrics */
        .metric-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .chart-mini { width: 50px; height: 50px; }
        .metric-info { text-align: right; }
        .metric-val-big { font-size: 1.2rem; font-weight: 700; color: var(--primary); font-family: 'JetBrains Mono', monospace; }
        .metric-label-small { font-size: 0.7rem; color: var(--text-muted); }

        .progress-dark { height: 4px; background: #0f172a; border-radius: 2px; overflow: hidden; margin-top: 5px; }
        .progress-bar-glow { height: 100%; background: var(--primary); box-shadow: 0 0 8px var(--primary); transition: width 0.5s; }

        /* --- DOCK ACTIONS (Proxmox Toolbar) --- */
        .rack-toolbar {
            margin-top: 20px;
            background: var(--bg-dock);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px;
            display: flex; justify-content: space-between;
        }

        .tool-btn {
            background: transparent; border: none; color: var(--text-muted);
            width: 32px; height: 32px; border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; font-size: 0.9rem;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .tool-btn.console:hover { color: #facc15; }
        .tool-btn.play:hover { color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .tool-btn.stop:hover { color: var(--accent); background: rgba(249, 115, 22, 0.1); }
        .tool-btn.delete:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

        /* --- MODAL DARK --- */
        .modal-content { background-color: var(--bg-card); border: 1px solid var(--border-color); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-header { border-bottom: 1px solid var(--border-color); }
        .modal-title { font-weight: 700; }
        .btn-close { filter: invert(1); }
        
        .form-label { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
        .form-control, .form-select {
            background-color: var(--bg-dock); border: 1px solid var(--border-color);
            color: white; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
        }
        .form-control:focus, .form-select:focus {
            background-color: var(--bg-dock); border-color: var(--primary);
            color: white; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .form-control::placeholder { color: #475569; }

        .os-card {
            border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; cursor: pointer; transition: 0.2s;
            text-align: center; background: var(--bg-dock);
        }
        .btn-check:checked + .os-card { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .os-card:hover { border-color: var(--text-muted); }

    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar-prox sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="brand-box">
                <div class="brand-icon"><i class="fas fa-server"></i></div>
                <div class="brand-text fs-4 text-white">NEXUS<span>CLOUD</span></div>
            </div>
            <button class="btn-create" data-bs-toggle="modal" data-bs-target="#createVMModal">
                <i class="fas fa-plus-circle"></i> Créer VM
            </button>
        </div>
    </nav>

    <div class="container py-4">
        
        <!-- HEADER STATS -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="stat-panel">
                    <div class="stat-icon-box text-success"><i class="fas fa-power-off"></i></div>
                    <div>
                        <div class="stat-label">Running VMs</div>
                        <div class="stat-val text-success" id="total-running">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-panel">
                    <div class="stat-icon-box text-primary"><i class="fas fa-microchip"></i></div>
                    <div>
                        <div class="stat-label">CPU Cluster</div>
                        <div class="stat-val text-primary" id="total-cpu">0%</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-panel">
                    <div class="stat-icon-box text-warning"><i class="fas fa-memory"></i></div>
                    <div>
                        <div class="stat-label">RAM Allocation</div>
                        <div class="stat-val text-warning" id="total-ram">0 G</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- EMPTY STATE -->
        <div id="empty-state" style="display:none; text-align:center; padding: 60px; opacity:0.3;">
            <i class="fas fa-server fa-4x mb-3"></i>
            <h5>Aucune ressource</h5>
            <p>Le cluster est vide. Déployez une instance.</p>
        </div>

        <!-- VM GRID -->
        <div class="vm-grid" id="vm-grid"></div>

    </div>

    <!-- MODAL CREATE VM -->
    <div class="modal fade" id="createVMModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-box-open me-2"></i>Provisioning Instance</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form action="/deploy" method="POST">
                        <div class="row g-3">
                            <!-- OS SELECTION -->
                            <div class="col-12 mb-2">
                                <label class="form-label">ISO Image</label>
                                <div class="d-flex gap-3">
                                    <div style="flex:1">
                                        <input type="radio" class="btn-check" name="os_type" id="os1" value="ubuntu" checked>
                                        <label class="os-card w-100" for="os1"><i class="fab fa-ubuntu me-2"></i>Ubuntu 22.04 LTS</label>
                                    </div>
                                    <div style="flex:1">
                                        <input type="radio" class="btn-check" name="os_type" id="os2" value="debian">
                                        <label class="os-card w-100" for="os2"><i class="fab fa-linux me-2"></i>Debian 12</label>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Hostname</label>
                                <input type="text" name="hostname" class="form-control" required placeholder="srv-prod-01">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">User Admin</label>
                                <input type="text" name="username" class="form-control" required placeholder="root_admin">
                            </div>
                            
                            <!-- MOT DE PASSE (Modifié avec Badge) -->
                            <div class="col-12">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label class="form-label mb-0">Mot de Passe</label>
                                    <span class="badge bg-warning text-dark border border-warning" style="font-size: 0.65rem;">
                                        <i class="fas fa-exclamation-circle"></i> Expire à la 1ère connexion
                                    </span>
                                </div>
                                <input type="password" name="password" class="form-control" required placeholder="Mot de passe temporaire...">
                            </div>

                            <div class="col-12"><hr class="border-secondary my-2"></div>

                            <div class="col-4">
                                <label class="form-label">Cores (Max 3)</label>
                                <input type="number" name="vcpu" class="form-control text-center" value="2" max="3">
                            </div>
                            <div class="col-4">
                                <label class="form-label">Memory (MB)</label>
                                <input type="number" name="ram" class="form-control text-center" value="2048" step="1024" max="4096">
                            </div>
                            <div class="col-4">
                                <label class="form-label">Storage (GB)</label>
                                <input type="number" name="disk" class="form-control text-center" value="10" max="50">
                            </div>
                            
                            <!-- SSH OPTIONS (MODIFIÉ : 3 CHOIX) -->
                            <div class="col-12 mt-3">
                                <div class="p-3 rounded" style="background: var(--bg-dock); border: 1px solid var(--border-color);">
                                    <label class="form-label mb-2">Méthode d'Accès</label>
                                    <div class="d-flex gap-3 mb-2 flex-wrap">
                                        <!-- Option 1: Aucune clé -->
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="ssh_method" id="ssh_none" value="none" onclick="toggleSSH('none')">
                                            <label class="form-check-label text-white" for="ssh_none">Mot de passe seul</label>
                                        </div>
                                        <!-- Option 2: Coller -->
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="ssh_method" id="ssh_paste" value="paste" checked onclick="toggleSSH('paste')">
                                            <label class="form-check-label text-white" for="ssh_paste">Clé existante (Coller)</label>
                                        </div>
                                        <!-- Option 3: Générer -->
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="ssh_method" id="ssh_gen" value="generate" onclick="toggleSSH('gen')">
                                            <label class="form-check-label text-white" for="ssh_gen">Générer Clé (Auto)</label>
                                        </div>
                                    </div>
                                    
                                    <!-- Zones dynamiques -->
                                    <div id="ssh-paste-area"><input name="ssh_key_paste" class="form-control form-control-sm" placeholder="ssh-rsa AAA..."></div>
                                    <div id="ssh-gen-area" style="display:none"><input name="ssh_key_name" class="form-control form-control-sm" placeholder="Nom du fichier pour le téléchargement"></div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Annuler</button>
                            <button class="btn btn-create">Déployer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CONSOLE -->
    <div class="modal fade" id="consoleModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white border-0">
                    <h5 class="modal-title font-monospace"><i class="fas fa-terminal me-2"></i>_CONSOLE</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="background: #000; color: #0f0; font-family: monospace;">
                    <div class="mb-3">
                        <label class="small text-secondary fw-bold">SSH CONNECTION</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark text-light border-secondary">$</span>
                            <input id="ssh-cmd" class="form-control bg-dark text-light border-secondary font-monospace shadow-none" readonly>
                            <button class="btn btn-outline-secondary" onclick="copyToClip('ssh-cmd')"><i class="far fa-copy"></i></button>
                        </div>
                    </div>
                    <div>
                        <label class="small text-secondary fw-bold">SERIAL ACCESS</label>
                        <div class="p-2 border border-secondary rounded text-break" style="color: #ccc;">
                            sudo virsh console <span id="virsh-vm-name" class="text-warning"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS JS -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        // LOGIQUE SSH AMELIOREE
        function toggleSSH(m) { 
            document.getElementById('ssh-paste-area').style.display = (m === 'paste') ? 'block' : 'none'; 
            document.getElementById('ssh-gen-area').style.display = (m === 'gen') ? 'block' : 'none'; 
            // Si 'none', tout est caché, et le backend ne recevra pas de clé, donc ce sera password only.
        }

        function copyToClip(id) { navigator.clipboard.writeText(document.getElementById(id).value); }
        function showConsole(n, ip) {
            document.getElementById('virsh-vm-name').innerText = n;
            document.getElementById('ssh-cmd').value = (ip && ip !== 'N/A') ? `ssh user@${ip}` : 'Waiting net...';
            new bootstrap.Modal(document.getElementById('consoleModal')).show();
        }
        function controlVM(n, a) {
            if (a === 'delete' && !confirm('⚠ CONFIRMATION\nSupprimer définitivement la VM ' + n + ' ?\nCette action est irréversible.')) return;
            fetch(`/api/vm/${n}/${a}`, { method: 'POST' }).then(r => r.json()).then(d => { if(d.success) fetchStats(); else alert(d.msg); });
        }

        let charts = {}, prevData = {};

        function renderVMs(vms) {
            let running = vms.filter(v => v.status === 'Running').length;
            let totalRam = vms.reduce((acc, v) => acc + v.max_mem, 0) / 1024;
            document.getElementById('total-running').innerText = running;
            document.getElementById('total-ram').innerText = totalRam.toFixed(1) + " G";
            document.getElementById('empty-state').style.display = vms.length === 0 ? 'block' : 'none';

            const names = vms.map(v => v.name);
            document.querySelectorAll('.vm-col').forEach(c => { if(!names.includes(c.id)) c.remove(); });
            const grid = document.getElementById('vm-grid');
            let globalCpuLoad = 0;

            vms.forEach(vm => {
                let cpu = 0;
                if (prevData[vm.name]) {
                    const dC = vm.cpu_time - prevData[vm.name].cpu_time;
                    const dT = vm.timestamp - prevData[vm.name].timestamp;
                    if (dT > 0) cpu = ((dC / 1e9) / dT / vm.vcpu) * 100;
                }
                prevData[vm.name] = vm;
                cpu = parseFloat(Math.min(Math.max(cpu, 0), 100).toFixed(1));
                if(vm.status === 'Running') globalCpuLoad += cpu;

                let ramPct = vm.max_mem > 0 ? ((vm.used_mem / vm.max_mem) * 100).toFixed(1) : 0;
                let col = document.getElementById(vm.name);
                const isRun = vm.status === 'Running';
                const statusClass = isRun ? 'running' : 'stopped';
                const statusText = isRun ? 'RUNNING' : 'STOPPED';
                const statusPill = isRun ? 'run' : 'stop';
                
                const btnPlay = isRun 
                    ? `<button class="tool-btn stop" onclick="controlVM('${vm.name}','stop')" title="Stop"><i class="fas fa-square"></i></button>`
                    : `<button class="tool-btn play" onclick="controlVM('${vm.name}','start')" title="Start"><i class="fas fa-play"></i></button>`;

                if (!col) {
                    col = document.createElement('div');
                    col.className = 'vm-col';
                    col.id = vm.name;
                    col.innerHTML = `
                    <div class="vm-rack ${statusClass}" id="rack-${vm.name}">
                        <div class="rack-header">
                            <div>
                                <h4 class="vm-name">${vm.name}</h4>
                                <span class="vm-ip" id="ip-${vm.name}">...</span>
                            </div>
                            <div class="status-pill ${statusPill}" id="pill-${vm.name}">${statusText}</div>
                        </div>

                        <div class="row g-0">
                            <div class="col-7 pe-3">
                                <div class="metric-row">
                                    <div>
                                        <div class="metric-val-big" id="cpu-val-${vm.name}">0%</div>
                                        <div class="metric-label-small">CPU Usage</div>
                                    </div>
                                    <div>
                                        <div class="metric-val-big" id="ram-val-${vm.name}">0%</div>
                                        <div class="metric-label-small">RAM RSS</div>
                                    </div>
                                </div>
                                <div class="progress-dark">
                                    <div class="progress-bar-glow" id="bar-${vm.name}" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="col-5 d-flex justify-content-center align-items-center">
                                <div style="height:60px; width:60px;">
                                    <canvas id="chart-${vm.name}"></canvas>
                                </div>
                            </div>
                        </div>

                        <div class="rack-toolbar">
                            <button class="tool-btn console" onclick="showConsole('${vm.name}','${vm.ip}')" title="Terminal"><i class="fas fa-terminal"></i></button>
                            <div id="btn-wrapper-${vm.name}" style="display:contents">${btnPlay}</div>
                            <button class="tool-btn delete" onclick="controlVM('${vm.name}','delete')" title="Destroy"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>`;
                    grid.appendChild(col);

                    const ctx = document.getElementById(`chart-${vm.name}`).getContext('2d');
                    charts[vm.name] = new Chart(ctx, {
                        type: 'doughnut',
                        data: { datasets: [{ data: [0, 100], backgroundColor: ['#3b82f6', '#334155'], borderWidth: 0 }] },
                        options: { cutout: '85%', events: [], tooltips: { enabled: false } }
                    });
                }

                // UPDATE
                const rack = document.getElementById(`rack-${vm.name}`);
                rack.className = `vm-rack ${statusClass}`;
                
                const pill = document.getElementById(`pill-${vm.name}`);
                pill.className = `status-pill ${statusPill}`;
                pill.innerText = statusText;

                document.getElementById(`ip-${vm.name}`).innerText = vm.ip || 'No IP';
                document.getElementById(`cpu-val-${vm.name}`).innerText = cpu + '%';
                document.getElementById(`ram-val-${vm.name}`).innerText = ramPct + '%';
                
                const bar = document.getElementById(`bar-${vm.name}`);
                bar.style.width = cpu + '%';
                bar.style.backgroundColor = cpu > 80 ? '#ef4444' : (cpu > 50 ? '#f97316' : '#3b82f6');
                
                document.getElementById(`btn-wrapper-${vm.name}`).innerHTML = btnPlay;

                if (charts[vm.name]) {
                    charts[vm.name].data.datasets[0].data = [vm.used_mem, vm.max_mem - vm.used_mem];
                    charts[vm.name].data.datasets[0].backgroundColor = [
                        ramPct > 85 ? '#ef4444' : '#3b82f6', 
                        '#334155'
                    ];
                    charts[vm.name].update();
                }
            });
            
            let avgCpu = vms.length > 0 ? (globalCpuLoad / vms.length).toFixed(1) : 0;
            document.getElementById('total-cpu').innerText = avgCpu + '%';
        }

        function fetchStats() {
            // CHECK ENVIRONMENT FOR DEMO/PREVIEW
            const isLocal = window.location.protocol === 'file:' || window.location.href.startsWith('blob:');

            if (isLocal) {
                 // MOCK DATA FOR PREVIEW
                 const mockVMs = [
                     { name: "web-srv-01", status: "Running", ip: "192.168.122.105", vcpu: 2, max_mem: 2048, used_mem: 1400, cpu_time: 0, timestamp: Date.now()/1000 },
                     { name: "db-prod", status: "Stopped", ip: "N/A", vcpu: 4, max_mem: 4096, used_mem: 0, cpu_time: 0, timestamp: Date.now()/1000 }
                 ];
                 renderVMs(mockVMs);
                 return;
            }

            // REAL FETCH
            fetch('/api/monitor')
                .then(r => r.json())
                .then(vms => {
                    renderVMs(vms);
                })
                .catch(e => {
                    console.error("Backend Disconnected:", e);
                });
        }
        setInterval(fetchStats, 2000); fetchStats();
    </script>
</body>
</html>
