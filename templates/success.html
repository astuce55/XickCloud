<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Provisioning | NEXUS</title>
    <link href="{{ url_for('static', filename='css/all.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap');

        :root {
            /* THÈME PROXMOX / DARK IDENTIQUE AU DASHBOARD */
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --bg-terminal: #020617;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .focus-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* CARTE PRINCIPALE STYLE RACK */
        .status-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary); /* Ligne de statut bleue au début */
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            transition: border-top-color 0.5s ease;
        }

        .status-card.success {
            border-top-color: var(--success);
        }

        /* SPINNER TECH */
        .spinner-container {
            position: relative;
            width: 80px; height: 80px;
            margin: 0 auto 30px auto;
        }
        
        .spinner-ring {
            width: 100%; height: 100%;
            border: 4px solid rgba(59, 130, 246, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .check-icon {
            font-size: 5rem; color: var(--success);
            display: none; margin-bottom: 20px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* TYPOGRAPHIE */
        h2 { font-weight: 700; margin-bottom: 10px; color: white; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 30px; }

        /* IP DISPLAY (STYLE TERMINAL) */
        .ip-reveal {
            background-color: var(--bg-terminal);
            border: 1px solid var(--border-color);
            color: var(--success);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
            display: none;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* TIMER BADGE */
        .timer-badge {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 5px 15px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 10px;
        }

        /* BOUTONS */
        .action-area { display: none; opacity: 0; transition: opacity 1s; }
        
        .btn-go {
            background: var(--primary); color: white;
            font-weight: 500; padding: 12px 30px; border-radius: 4px;
            text-decoration: none; display: inline-block; width: 100%;
            border: none; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem;
        }
        .btn-go:hover { background: #2563eb; transform: translateY(-2px); color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        .key-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--warning);
            padding: 15px; border-radius: 6px; margin-bottom: 20px;
            text-align: left; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        
        .error-msg { color: var(--danger); font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="focus-container">
        
        <div class="status-card" id="main-card">
            
            <!-- LOADER -->
            <div id="loader" class="spinner-container">
                <div class="spinner-ring"></div>
            </div>

            <!-- SUCCESS ICON -->
            <div id="success-icon-container" style="text-align: center;">
                <i class="fas fa-check-circle check-icon" id="success-icon"></i>
            </div>

            <h2 id="title-text">Provisioning...</h2>
            <p id="sub-text">Configuration du système et attente réseau.</p>

            <!-- RESULTAT IP -->
            <div class="ip-reveal" id="ip-box"></div>

            <!-- KEY DOWNLOAD (Si nécessaire) -->
            {% if key_download %}
            <div class="action-area" id="key-area">
                <div class="key-box">
                    <div><i class="fas fa-key me-2"></i>Clé privée générée</div>
                    <a href="/download_key/{{ key_download }}" class="btn btn-sm btn-outline-warning fw-bold">Télécharger</a>
                </div>
            </div>
            {% endif %}

            <!-- BOUTON DE SORTIE -->
            <div class="action-area" id="final-actions">
                <a href="/" class="btn-go"><i class="fas fa-columns me-2"></i> Accéder au Dashboard</a>
            </div>

            <div class="timer-badge">
                <i class="fas fa-stopwatch me-2"></i><span id="timer">0.0</span>s
            </div>

            <div id="timeout-msg" class="error-msg">
                <i class="fas fa-exclamation-triangle me-2"></i> Délai dépassé. <a href="/" class="text-white text-decoration-underline">Forcer le retour</a>
            </div>

        </div>

    </div>

    <script>
        const hostname = "{{ hostname }}";
        const statusEndpoint = `/api/monitor`; 
        let startTime = Date.now();
        let timerInterval;

        // 1. Chronomètre
        function startTimer() {
            timerInterval = setInterval(() => {
                let elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('timer').innerText = elapsed;
                
                // Timeout Sécurité 60s
                if(elapsed > 60 && document.getElementById('ip-box').style.display === 'none') {
                    document.getElementById('timeout-msg').style.display = 'block';
                    document.getElementById('sub-text').innerText = "La VM ne répond pas dans les temps.";
                    document.getElementById('sub-text').style.color = "var(--danger)";
                    document.getElementById('loader').style.display = 'none';
                }
            }, 100);
        }

        // 2. Polling Intelligent
        function checkStatus() {
            fetch(statusEndpoint)
                .then(r => r.json())
                .then(vms => {
                    const vm = vms.find(v => v.name === hostname);
                    
                    // On attend que l'IP soit valide (pas N/A, pas vide)
                    if (vm && vm.status === 'Running' && vm.ip && vm.ip.length > 6 && vm.ip !== 'N/A') {
                        finishProcess(vm.ip);
                    } else {
                        setTimeout(checkStatus, 1500); // Check toutes les 1.5s
                    }
                })
                .catch(e => setTimeout(checkStatus, 2000));
        }

        // 3. Affichage du succès
        function finishProcess(ip) {
            clearInterval(timerInterval);
            let finalTime = ((Date.now() - startTime) / 1000).toFixed(1);

            // Changement visuel : Carte devient verte en haut
            document.getElementById('main-card').classList.add('success');
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('success-icon').style.display = 'block';
            
            document.getElementById('title-text').innerText = "Instance Prête";
            document.getElementById('title-text').style.color = "var(--success)";
            document.getElementById('sub-text').innerText = `Déploiement terminé en ${finalTime} secondes.`;
            
            // Affichage IP style Terminal
            const ipBox = document.getElementById('ip-box');
            ipBox.innerText = ip; // Pas besoin de "IP: " car le design le suggère
            ipBox.style.display = 'block';

            // Affichage Boutons
            document.getElementById('final-actions').style.display = 'block';
            setTimeout(() => { document.getElementById('final-actions').style.opacity = '1'; }, 100);
            
            const keyArea = document.getElementById('key-area');
            if(keyArea) {
                keyArea.style.display = 'block';
                setTimeout(() => { keyArea.style.opacity = '1'; }, 100);
            }
        }

        startTimer();
        setTimeout(checkStatus, 2000); // Premier check après 2s
    </script>
</body>
</html>
