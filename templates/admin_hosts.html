<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Hôtes KVM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            font-size: 24px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        
        .hosts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .host-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .host-card:hover {
            transform: translateY(-5px);
        }
        
        .host-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .host-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .host-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-online {
            background: #d4edda;
            color: #155724;
        }
        
        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        .priority-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .priority-1 {
            background: #ffd700;
            color: #333;
        }
        
        .priority-2 {
            background: #c0c0c0;
            color: #333;
        }
        
        .priority-3 {
            background: #cd7f32;
            color: white;
        }
        
        .host-info {
            margin-bottom: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 14px;
        }
        
        .info-label {
            color: #666;
        }
        
        .info-value {
            font-weight: bold;
            color: #333;
        }
        
        .resources {
            margin-top: 15px;
        }
        
        .resource-bar {
            margin-bottom: 12px;
        }
        
        .resource-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        
        .progress-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }
        
        .progress-fill.warning {
            background: #ffc107;
        }
        
        .progress-fill.danger {
            background: #dc3545;
        }
        
        .host-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
        
        .host-actions button {
            flex: 1;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background: white;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .form-group small {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 12px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .back-link {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🖥️ Gestion des Hôtes KVM</h1>
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <button class="btn btn-primary" onclick="showAddModal()">➕ Ajouter un Hôte</button>
                <button class="btn btn-secondary" onclick="loadHosts()">🔄 Actualiser</button>
                <a href="/" class="back-link">← Retour au Dashboard</a>
            </div>
        </div>
        
        <div id="hostsGrid" class="hosts-grid">
            <!-- Les cartes d'hôtes seront générées ici -->
        </div>
    </div>
    
    <!-- Modal Ajouter/Éditer -->
    <div id="hostModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Ajouter un Hôte KVM</h2>
            </div>
            <form id="hostForm">
                <input type="hidden" id="hostId" name="id">
                
                <div class="form-group">
                    <label>Nom de l'hôte *</label>
                    <input type="text" id="hostName" required placeholder="ex: KVM Serveur Principal">
                </div>
                
                <div class="form-group">
                    <label>URI de connexion *</label>
                    <input type="text" id="hostUri" required placeholder="ex: qemu+ssh://user@192.168.1.100/system">
                    <small>Format: qemu:///system (local) ou qemu+ssh://user@ip/system (distant)</small>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Priorité *</label>
                        <input type="number" id="hostPriority" required min="1" value="1">
                        <small>1 = plus haute priorité</small>
                    </div>
                    
                    <div class="form-group">
                        <label>Chemin de stockage</label>
                        <input type="text" id="hostStorage" value="/var/lib/libvirt/images">
                    </div>
                </div>
                
                <div class="form-group">
                    <h3 style="margin-bottom: 10px;">Quotas de ressources</h3>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>vCPU Maximum</label>
                        <input type="number" id="maxVcpu" min="1" value="8">
                    </div>
                    
                    <div class="form-group">
                        <label>RAM Maximum (MiB)</label>
                        <input type="number" id="maxRam" min="1024" step="1024" value="16384">
                        <small>16384 MiB = 16 GB</small>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Disque Maximum (GB)</label>
                    <input type="number" id="maxDisk" min="10" value="200">
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="hostDescription" rows="3" placeholder="Description de l'hôte..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="hostEnabled" checked>
                        Activer cet hôte
                    </label>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        let currentHostId = null;
        
        // Charger les hôtes au démarrage
        document.addEventListener('DOMContentLoaded', function() {
            loadHosts();
        });
        
        // Charger tous les hôtes
        async function loadHosts() {
            try {
                const response = await fetch('/api/admin/hosts');
                const hosts = await response.json();
                
                const grid = document.getElementById('hostsGrid');
                grid.innerHTML = '';
                
                if (hosts.length === 0) {
                    grid.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">Aucun hôte configuré</p>';
                    return;
                }
                
                hosts.forEach(host => {
                    const card = createHostCard(host);
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors du chargement des hôtes');
            }
        }
        
        // Créer une carte d'hôte
        function createHostCard(host) {
            const card = document.createElement('div');
            card.className = 'host-card';
            
            const status = host.status || 'offline';
            const usage = host.usage || {};
            
            const vcpuPercent = usage.vcpu_percent || 0;
            const ramPercent = usage.ram_percent || 0;
            
            let vcpuClass = '';
            if (vcpuPercent > 80) vcpuClass = 'danger';
            else if (vcpuPercent > 60) vcpuClass = 'warning';
            
            let ramClass = '';
            if (ramPercent > 80) ramClass = 'danger';
            else if (ramPercent > 60) ramClass = 'warning';
            
            const priorityClass = `priority-${Math.min(host.priority || 999, 3)}`;
            
            card.innerHTML = `
                <div class="host-header">
                    <div>
                        <span class="host-name">${host.name}</span>
                        <span class="priority-badge ${priorityClass}">Priorité ${host.priority}</span>
                    </div>
                    <span class="host-status status-${status}">${status === 'online' ? '🟢 En ligne' : '🔴 Hors ligne'}</span>
                </div>
                
                <div class="host-info">
                    <div class="info-row">
                        <span class="info-label">URI:</span>
                        <span class="info-value" style="font-size: 12px;">${host.uri}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Stockage:</span>
                        <span class="info-value">${host.storage_path}</span>
                    </div>
                    ${host.description ? `
                    <div class="info-row">
                        <span class="info-label">Description:</span>
                        <span class="info-value">${host.description}</span>
                    </div>
                    ` : ''}
                </div>
                
                ${usage && status === 'online' ? `
                <div class="resources">
                    <div class="resource-bar">
                        <div class="resource-label">
                            <span>vCPU</span>
                            <span>${usage.used_vcpu || 0} / ${usage.max_vcpu || 0}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${vcpuClass}" style="width: ${vcpuPercent}%"></div>
                        </div>
                    </div>
                    
                    <div class="resource-bar">
                        <div class="resource-label">
                            <span>RAM</span>
                            <span>${Math.round(usage.used_ram || 0)} / ${usage.max_ram || 0} MiB</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${ramClass}" style="width: ${ramPercent}%"></div>
                        </div>
                    </div>
                    
                    <div class="resource-bar">
                        <div class="resource-label">
                            <span>Disque</span>
                            <span>${usage.used_disk || 0} / ${usage.max_disk || 0} GB</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(usage.used_disk / usage.max_disk * 100) || 0}%"></div>
                        </div>
                    </div>
                </div>
                ` : ''}
                
                <div class="host-actions">
                    <button class="btn btn-warning" onclick="editHost('${host.id}')">✏️ Éditer</button>
                    <button class="btn ${host.enabled ? 'btn-secondary' : 'btn-success'}" 
                            onclick="toggleHost('${host.id}', ${!host.enabled})">
                        ${host.enabled ? '⏸️ Désactiver' : '▶️ Activer'}
                    </button>
                    <button class="btn btn-danger" onclick="deleteHost('${host.id}', '${host.name}')">🗑️ Supprimer</button>
                </div>
            `;
            
            return card;
        }
        
        // Afficher le modal d'ajout
        function showAddModal() {
            currentHostId = null;
            document.getElementById('modalTitle').textContent = 'Ajouter un Hôte KVM';
            document.getElementById('hostForm').reset();
            document.getElementById('hostId').value = '';
            document.getElementById('hostModal').style.display = 'block';
        }
        
        // Éditer un hôte
        async function editHost(hostId) {
            try {
                const response = await fetch('/api/admin/hosts');
                const hosts = await response.json();
                const host = hosts.find(h => h.id === hostId);
                
                if (!host) return;
                
                currentHostId = hostId;
                document.getElementById('modalTitle').textContent = 'Éditer l\'Hôte KVM';
                document.getElementById('hostId').value = host.id;
                document.getElementById('hostName').value = host.name;
                document.getElementById('hostUri').value = host.uri;
                document.getElementById('hostPriority').value = host.priority || 1;
                document.getElementById('hostStorage').value = host.storage_path || '/var/lib/libvirt/images';
                document.getElementById('maxVcpu').value = host.quotas?.max_vcpu || 8;
                document.getElementById('maxRam').value = host.quotas?.max_ram || 16384;
                document.getElementById('maxDisk').value = host.quotas?.max_disk || 200;
                document.getElementById('hostDescription').value = host.description || '';
                document.getElementById('hostEnabled').checked = host.enabled !== false;
                
                document.getElementById('hostModal').style.display = 'block';
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors du chargement de l\'hôte');
            }
        }
        
        // Fermer le modal
        function closeModal() {
            document.getElementById('hostModal').style.display = 'none';
            currentHostId = null;
        }
        
        // Soumettre le formulaire
        document.getElementById('hostForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                id: document.getElementById('hostId').value || `host-${Date.now()}`,
                name: document.getElementById('hostName').value,
                uri: document.getElementById('hostUri').value,
                priority: parseInt(document.getElementById('hostPriority').value),
                storage_path: document.getElementById('hostStorage').value,
                max_vcpu: parseInt(document.getElementById('maxVcpu').value),
                max_ram: parseInt(document.getElementById('maxRam').value),
                max_disk: parseInt(document.getElementById('maxDisk').value),
                description: document.getElementById('hostDescription').value,
                enabled: document.getElementById('hostEnabled').checked
            };
            
            try {
                let response;
                if (currentHostId) {
                    response = await fetch(`/api/admin/hosts/${currentHostId}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                } else {
                    response = await fetch('/api/admin/hosts', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                }
                
                if (response.ok) {
                    closeModal();
                    loadHosts();
                    alert(currentHostId ? 'Hôte modifié avec succès' : 'Hôte ajouté avec succès');
                } else {
                    alert('Erreur lors de l\'enregistrement');
                }
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors de l\'enregistrement');
            }
        });
        
        // Activer/Désactiver un hôte
        async function toggleHost(hostId, enabled) {
            try {
                const response = await fetch('/api/admin/hosts');
                const hosts = await response.json();
                const host = hosts.find(h => h.id === hostId);
                
                if (!host) return;
                
                host.enabled = enabled;
                
                const updateResponse = await fetch(`/api/admin/hosts/${hostId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(host)
                });
                
                if (updateResponse.ok) {
                    loadHosts();
                }
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors de la modification');
            }
        }
        
        // Supprimer un hôte
        async function deleteHost(hostId, hostName) {
            if (!confirm(`Êtes-vous sûr de vouloir supprimer l'hôte "${hostName}" ?\n\nAttention: Les VMs sur cet hôte ne seront pas supprimées.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/admin/hosts/${hostId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadHosts();
                    alert('Hôte supprimé avec succès');
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors de la suppression');
            }
        }
        
        // Fermer le modal en cliquant à l'extérieur
        window.onclick = function(event) {
            const modal = document.getElementById('hostModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
