<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudAdmin - Gestion des Hôtes KVM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #080c14;
            --bg-card: #111827;
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #fbbf24;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            background-image: radial-gradient(circle at top right, rgba(124, 58, 237, 0.07), transparent 40%);
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* Header Styles */
        .header-section {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 3rem;
        }

        .header-title h1 {
            font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-title p { color: var(--text-muted); margin-top: 4px; font-size: 0.95rem; }

        /* Stats Grid */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem; margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card); padding: 1.5rem; border-radius: 20px;
            border: 1px solid var(--border); position: relative; overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .stat-card::after {
            content: ''; position: absolute; top: 0; right: 0;
            width: 60px; height: 60px; background: var(--accent);
            opacity: 0.05; border-radius: 0 0 0 100%;
        }

        .stat-label { color: var(--text-muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 2.2rem; font-weight: 700; margin-top: 0.5rem; display: block; }

        /* Buttons */
        .btn {
            padding: 12px 24px; border-radius: 12px; border: none;
            cursor: pointer; font-weight: 600; display: inline-flex;
            align-items: center; gap: 10px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9rem; text-decoration: none;
        }

        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }
        .btn-primary:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4); }
        
        .btn-secondary { background: var(--glass); color: white; border: 1px solid var(--border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }

        /* Hosts Cards */
        .hosts-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2rem;
        }

        .host-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 24px; padding: 1.8rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .host-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .host-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .host-name { font-weight: 700; font-size: 1.25rem; color: #fff; margin-bottom: 4px; }
        
        .status-badge {
            padding: 6px 14px; border-radius: 12px; font-size: 0.7rem;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px;
        }

        .status-online { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-offline { background: rgba(244, 63, 94, 0.1); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.2); }

        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-bottom: 1.5rem; background: rgba(0,0,0,0.2);
            padding: 14px; border-radius: 16px;
        }

        .info-item label { color: var(--text-muted); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; display: block; }
        .info-item span { font-size: 0.85rem; color: #cbd5e1; font-weight: 500; word-break: break-all; }

        /* Resource Management */
        .resource-bar { margin-bottom: 16px; }
        .resource-label {
            display: flex; justify-content: space-between;
            font-size: 0.8rem; margin-bottom: 8px; font-weight: 500; color: var(--text-muted);
        }
        .progress-bg {
            height: 8px; background: rgba(255,255,255,0.05);
            border-radius: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 10px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Card Actions */
        .card-actions {
            display: flex; gap: 10px; margin-top: 1.5rem;
            padding-top: 1.5rem; border-top: 1px solid var(--border);
        }
        
        .btn-icon {
            width: 42px; height: 42px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); color: var(--text-muted);
            transition: all 0.2s; cursor: pointer; background: var(--glass);
        }

        .btn-icon:hover { background: var(--glass); color: white; transform: scale(1.05); }
        .btn-icon.edit:hover { color: var(--warning); border-color: var(--warning); }
        .btn-icon.delete:hover { color: var(--danger); border-color: var(--danger); }

        /* Modals */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 1000; padding: 20px;
        }

        .modal-content {
            background: var(--bg-card); max-width: 550px;
            margin: 4rem auto; border-radius: 24px;
            border: 1px solid var(--border); padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%; background: #0f172a; border: 1px solid var(--border);
            padding: 12px 16px; border-radius: 12px; color: white;
            outline: none; transition: all 0.2s; font-size: 0.95rem;
        }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-section">
            <div class="header-title">
                <h1><i class="fas fa-server" style="color: var(--accent); margin-right: 12px;"></i>Hôtes KVM</h1>
                <p>Gestion et monitoring de l'infrastructure physique</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <a href="/" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Dashboard</a>
                <button class="btn btn-secondary" onclick="loadHosts()"><i class="fas fa-sync-alt"></i></button>
                <button class="btn btn-primary" onclick="showAddModal()">
                    <i class="fas fa-plus"></i> Nouvel Hôte
                </button>
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Hôtes Totaux</span>
                <span class="stat-value" id="statTotalHosts">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Hôtes Actifs</span>
                <span class="stat-value" id="statOnlineHosts" style="color: var(--success)">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Capacité vCPU</span>
                <span class="stat-value" id="statTotalVcpu" style="color: var(--accent-light)">0</span>
            </div>
        </section>
        
        <div id="hostsGrid" class="hosts-grid">
            </div>
    </div>

    <div id="hostModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 2rem;" id="modalTitle">Ajouter un Hôte</h2>
            <form id="hostForm">
                <input type="hidden" id="hostId">
                <div class="form-group">
                    <label>Nom de l'hôte</label>
                    <input type="text" id="hostName" placeholder="ex: Compute-Node-01" required>
                </div>
                <div class="form-group">
                    <label>URI Libvirt (SSH conseillé)</label>
                    <input type="text" id="hostUri" placeholder="qemu+ssh://user@ip/system" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Priorité (1-10)</label>
                        <input type="number" id="hostPriority" value="1">
                    </div>
                    <div class="form-group">
                        <label>RAM Max (MiB)</label>
                        <input type="number" id="maxRam" value="16384">
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 1rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer l'hôte</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function loadHosts() {
            try {
                const response = await fetch('/api/admin/hosts');
                const hosts = await response.json();
                updateStats(hosts);
                renderGrid(hosts);
            } catch (e) { 
                console.error("Erreur de chargement:", e); 
            }
        }

        function updateStats(hosts) {
            document.getElementById('statTotalHosts').textContent = hosts.length;
            document.getElementById('statOnlineHosts').textContent = hosts.filter(h => h.status === 'online').length;
            const totalVcpu = hosts.reduce((acc, h) => acc + (h.quotas?.max_vcpu || 0), 0);
            document.getElementById('statTotalVcpu').textContent = totalVcpu;
        }

        function getProgressColor(percent) {
            if (percent > 90) return 'var(--danger)';
            if (percent > 75) return 'var(--warning)';
            return 'var(--accent)';
        }

        function createHostCard(host) {
            const card = document.createElement('div');
            const isOnline = host.status === 'online';
            card.className = `host-card`;
            
            const usage = host.usage || { vcpu_percent: 0, ram_percent: 0 };
            const vcpuColor = getProgressColor(usage.vcpu_percent);
            const ramColor = getProgressColor(usage.ram_percent);
            
            card.innerHTML = `
                <div class="host-header">
                    <div>
                        <div class="host-name">${host.name}</div>
                        <div style="font-size: 0.7rem; color: var(--text-muted); font-family: monospace;">ID: ${host.id}</div>
                    </div>
                    <span class="status-badge ${isOnline ? 'status-online' : 'status-offline'}">
                        <i class="fas ${isOnline ? 'fa-circle' : 'fa-circle-notch'}" style="font-size: 8px;"></i>
                        ${isOnline ? 'Online' : 'Offline'}
                    </span>
                </div>
                
                <div class="info-grid">
                    <div class="info-item">
                        <label>Priorité</label>
                        <span>Tier ${host.priority}</span>
                    </div>
                    <div class="info-item">
                        <label>Endpoint</label>
                        <span>${host.uri.split('@')[1] || host.uri}</span>
                    </div>
                </div>

                ${isOnline ? `
                <div class="resource-bar">
                    <div class="resource-label">
                        <span><i class="fas fa-microchip" style="width:15px"></i> vCPU</span>
                        <span>${usage.used_vcpu || 0} / ${usage.max_vcpu || 0}</span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${usage.vcpu_percent}%; background: ${vcpuColor}"></div>
                    </div>
                </div>
                <div class="resource-bar">
                    <div class="resource-label">
                        <span><i class="fas fa-memory" style="width:15px"></i> RAM</span>
                        <span>${Math.round(usage.used_ram/1024 || 0)}GB / ${Math.round(usage.max_ram/1024 || 0)}GB</span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${usage.ram_percent}%; background: ${ramColor}"></div>
                    </div>
                </div>
                ` : `
                <div style="text-align:center; padding: 35px 20px; color: var(--text-muted); background: rgba(0,0,0,0.2); border-radius: 16px; border: 1px dashed var(--border);">
                    <i class="fas fa-ghost" style="font-size: 24px; margin-bottom: 12px; opacity: 0.3;"></i>
                    <p style="font-size: 0.85rem;">Hôte injoignable ou désactivé</p>
                </div>`}

                <div class="card-actions">
                    <button class="btn-icon edit" onclick="editHost('${host.id}')" title="Modifier"><i class="fas fa-pen"></i></button>
                    <button class="btn-icon" onclick="toggleHost('${host.id}', ${!host.enabled})" title="${host.enabled ? 'Suspendre' : 'Démarrer'}">
                        <i class="fas ${host.enabled ? 'fa-pause' : 'fa-play'}"></i>
                    </button>
                    <div style="flex-grow: 1;"></div>
                    <button class="btn-icon delete" onclick="deleteHost('${host.id}', '${host.name}')" title="Supprimer"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
            return card;
        }

        function renderGrid(hosts) {
            const grid = document.getElementById('hostsGrid');
            grid.innerHTML = '';
            hosts.forEach(host => grid.appendChild(createHostCard(host)));
        }

        function showAddModal() {
            document.getElementById('hostForm').reset();
            document.getElementById('hostId').value = '';
            document.getElementById('modalTitle').textContent = "Ajouter un Hôte";
            document.getElementById('hostModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('hostModal').style.display = 'none'; }

        // Initialisation au chargement
        document.addEventListener('DOMContentLoaded', loadHosts);

        // Fermeture modal clic extérieur
        window.onclick = (event) => {
            if (event.target == document.getElementById('hostModal')) closeModal();
        }
    </script>
</body>
</html>
