<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>XICK Cloud - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #050507 0%, #1a1a2e 100%);
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo i {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 16px;
        }
        .login-logo h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .login-logo p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-control {
            background: #1c1c24;
            border: 1px solid var(--border);
            padding: 12px 16px;
            color: white;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            outline: none;
        }
        .btn-login {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }
        .alert {
            background: #dc354533;
            border: 1px solid #dc3545;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .demo-credentials {
            margin-top: 24px;
            padding: 16px;
            background: #1c1c24;
            border-radius: 12px;
            font-size: 0.85rem;
        }
        .demo-credentials h6 {
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 600;
        }
        .demo-credentials code {
            background: var(--bg-body);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-bolt"></i>
                <h1>XICK CLOUD</h1>
                <p>Multi-tenant IaaS Platform</p>
            </div>

            {% if error %}
            <div class="alert">
                <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="small text-muted mb-2">Nom d'utilisateur</label>
                    <input type="text" name="username" class="form-control" 
                           placeholder="Entrez votre nom d'utilisateur" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="small text-muted mb-2">Mot de passe</label>
                    <input type="password" name="password" class="form-control" 
                           placeholder="Entrez votre mot de passe" required>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                </button>
            </form>

            <div class="demo-credentials">
                <h6><i class="fas fa-info-circle me-2"></i>Comptes de démonstration</h6>
                <div class="mb-2">
                    <strong>Admin:</strong> <code>admin</code> / <code>admin123</code>
                </div>
                <div>
                    <strong>Utilisateur:</strong> <code>user1</code> / <code>user123</code>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
