<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>XICK Cloud - Connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #050508;
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.4);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --glass: rgba(15, 23, 42, 0.6);
        }
        
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Orbs */
        .bg-glow {
            position: absolute; width: 40vw; height: 40vw;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -10%; right: -5%; z-index: 0; opacity: 0.5;
            animation: pulse 8s infinite alternate;
        }
        .bg-glow-2 {
            position: absolute; width: 30vw; height: 30vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            bottom: -5%; left: -5%; z-index: 0;
            animation: pulse 12s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }
        
        .login-container {
            width: 100%; max-width: 480px;
            padding: 20px; z-index: 10;
        }
        
        .login-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 3rem;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            opacity: 0; transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .login-header { text-align: center; margin-bottom: 2.5rem; }
        
        .login-logo {
            font-size: 2.5rem; color: white;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            width: 70px; height: 70px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
        }
        
        .login-title {
            font-size: 2.2rem; font-weight: 800; letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to bottom, #fff 40%, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .login-subtitle { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }
        
        .form-group { margin-bottom: 1.5rem; }
        
        .form-label {
            display: block; color: var(--text-main); font-weight: 600;
            margin-bottom: 10px; font-size: 0.85rem; opacity: 0.9;
        }
        
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%); color: var(--text-muted);
            font-size: 1rem;
        }
        
        .form-control {
            width: 100%; background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border); color: white;
            border-radius: 16px; padding: 14px 16px 14px 48px;
            transition: all 0.3s; font-size: 1rem;
        }
        
        .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }
        
        .btn-login {
            width: 100%; background: #fff;
            color: #000; border: none; padding: 16px;
            border-radius: 16px; font-weight: 700; font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        
        .btn-login:hover {
            transform: scale(1.02);
            background: var(--accent);
            color: white;
            box-shadow: 0 15px 30px rgba(124, 58, 237, 0.4);
        }

        /* Alert Styles */
        .alert {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: #fb7185; padding: 14px;
            border-radius: 16px; margin-bottom: 1.5rem;
            font-size: 0.9rem; font-weight: 500;
            display: flex; align-items: center; gap: 10px;
        }
        
        /* Demo Box */
        .demo-credentials {
            margin-top: 2rem; padding: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px; border: 1px solid var(--border);
        }
        
        .demo-title {
            color: var(--text-muted); font-size: 0.75rem;
            font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 1rem;
            display: flex; align-items: center; gap: 8px;
        }
        
        .demo-account {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-size: 0.85rem;
        }
        
        .demo-account code {
            background: rgba(0, 0, 0, 0.4); padding: 4px 10px;
            border-radius: 8px; color: var(--accent-light);
            font-family: monospace; font-size: 0.8rem;
        }
        
        .footer-text {
            text-align: center; margin-top: 2rem;
            color: var(--text-muted); font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="login-container">
        <div class="login-card" id="loginCard">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-bolt"></i>
                </div>
                <h1 class="login-title">XICK CLOUD</h1>
                <p class="login-subtitle">Plateforme Multi-tenant Next-Gen</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert">
                            <i class="fas fa-circle-exclamation"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label class="form-label">Identifiant</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" class="form-control" 
                               placeholder="Nom d'utilisateur" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" class="form-control" 
                               placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    Se connecter <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="demo-credentials">
                <div class="demo-title"><i class="fas fa-key"></i> Accès Démo</div>
                <div class="demo-account">
                    <span>Admin</span>
                    <code>admin / admin123</code>
                </div>
                <div class="demo-account">
                    <span>User</span>
                    <code>user1 / user123</code>
                </div>
            </div>

            <div class="footer-text">
                <i class="fas fa-shield-halved"></i> SECURE CLOUD ACCESS
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const card = document.getElementById('loginCard');
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
