<!-- templates/components/navbar.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('dashboard.index') }}">
            <i class="fas fa-bolt me-2"></i>
            <span class="fw-bold">XICK</span>CLOUD
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'dashboard.index' %}active{% endif %}" 
                       href="{{ url_for('dashboard.index') }}">
                        <i class="fas fa-home me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'iaas.index' %}active{% endif %}" 
                       href="{{ url_for('iaas.index') }}">
                        <i class="fas fa-server me-1"></i>IaaS
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'swarm.index' %}active{% endif %}" 
                       href="{{ url_for('swarm.index') }}">
                        <i class="fab fa-docker me-1"></i>Docker Swarm
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'paas.index' %}active{% endif %}" 
                       href="{{ url_for('paas.index') }}">
                        <i class="fas fa-cube me-1"></i>PaaS
                    </a>
                </li>
                {% if session.get('role') == 'admin' %}
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint.startswith('admin.') %}active{% endif %}" 
                       href="{{ url_for('admin.index') }}">
                        <i class="fas fa-cog me-1"></i>Admin
                    </a>
                </li>
                {% endif %}
            </ul>
            
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" 
                       data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle me-1"></i>
                        {{ session.username }}
                        {% if session.get('role') == 'admin' %}
                        <span class="badge bg-danger ms-1">Admin</span>
                        {% endif %}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" href="{{ url_for('auth.logout') }}">
                                <i class="fas fa-sign-out-alt me-2"></i>Déconnexion
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
